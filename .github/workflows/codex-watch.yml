# Veille des versions de Codex CLI (lecture seule). N'installe, ne met à jour et n'exécute JAMAIS Codex ; aucune clé ni donnée du projet envoyée.
# Seul le jeton éphémère GITHUB_TOKEN de l'Action est utilisé (lecture des releases publiques, création d'une issue de signalement).
# NB : les déclenchements planifiés ne s'exécutent que depuis la branche par défaut ; ce fichier reste inactif tant qu'il n'y est pas.
name: codex-watch

on:
  schedule:
    - cron: '17 6 * * 1'   # chaque lundi, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: codex-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: tools/codex-watch
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Comparer les versions et analyser les notes
        id: watch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/codex-watch/check.mjs --out "$RUNNER_TEMP/codex-watch-report.md"
      - name: Résumé du job
        run: cat "$RUNNER_TEMP/codex-watch-report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: codex-watch-report
          path: ${{ runner.temp }}/codex-watch-report.md
          retention-days: 30
      - name: Ouvrir une issue si une version pertinente est détectée (une seule fois par version)
        if: steps.watch.outputs.relevant == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONS: ${{ steps.watch.outputs.versions }}
          LATEST: ${{ steps.watch.outputs.latest }}
        run: |
          set -euo pipefail
          title="Codex CLI ${LATEST} : version pertinente pour l'isolation (veille)"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --search "\"Codex CLI ${LATEST}\" in:title" --json number --jq 'length')"
          if [ "$existing" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/codex-watch-report.md"
          else
            echo "Issue déjà ouverte pour ${LATEST} : aucun doublon."
          fi
